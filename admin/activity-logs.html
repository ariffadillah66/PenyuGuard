<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Aktivitas — Admin PenyuGuard</title>
  <link rel="icon" type="image/png" href="../assets/logo/penyuguard.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/ocean-theme.css">
</head>
<body class="adm-body" data-auth-area="admin" data-require="admin" data-active="logs">
<div class="adm-layout" id="adm-layout">
  <aside class="adm-sidebar" id="pg-sidebar"></aside>
  <div class="adm-drawer-overlay" id="adm-overlay"></div>
  <div class="adm-main">
    <header class="adm-topbar" id="pg-topbar"></header>
    <main class="adm-content">
      <div class="adm-page-head">
        <div>
          <h1>Log Aktivitas</h1>
          <p>Rekam jejak aktivitas yang tersimpan, seperti verifikasi dan perubahan data.</p>
        </div>
        <button class="btn btn-outline btn-sm" id="logs-export"><i class="fa-solid fa-file-csv"></i> Ekspor CSV</button>
      </div>
      <div id="logs-filter"></div>
      <div class="card mt-16">
        <div class="card-head">
          <div><h3>Rekam Aktivitas Sistem</h3><p id="logs-count">—</p></div>
          <span class="badge badge-muted"><i class="fa-solid fa-database"></i> Maksimal 400 log terakhir</span>
        </div>
        <div id="logs-table"></div>
        <div class="adm-table-foot"><div class="pagination" id="logs-pagination"></div></div>
      </div>
    </main>
    <footer class="adm-footer" id="adm-footer"></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../config/runtime-config.js"></script>
<script src="../config/supabase.js"></script>
<script src="../js/data-fallback.js"></script>
<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script src="../js/admin/admin.js"></script>
</body>
</html>
