<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Pengguna — Admin PenyuGuard</title>
  <link rel="icon" type="image/png" href="../assets/logo/penyuguard.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/ocean-theme.css">
</head>
<body class="adm-body" data-auth-area="admin" data-require="admin" data-active="users">
<div class="adm-layout" id="adm-layout">
  <aside class="adm-sidebar" id="pg-sidebar"></aside>
  <div class="adm-drawer-overlay" id="adm-overlay"></div>
  <div class="adm-main">
    <header class="adm-topbar" id="pg-topbar"></header>
    <main class="adm-content">
      <div class="adm-page-head">
        <div>
          <h1>Manajemen Pengguna</h1>
          <p>Kelola akun pengguna, peran, dan status akses — khusus Administrator.</p>
        </div>
        <button class="btn btn-primary" id="btn-add-operator"><i class="fa-solid fa-user-plus"></i> Tambah Operator</button>
      </div>

      <div class="adm-stat-grid" id="stat-users"></div>

      <div class="card mt-20">
        <div class="card-head">
          <div>
            <h3>Daftar Akun Pengguna</h3>
            <p>Akun operator/administrator hanya dapat dikelola oleh Administrator.</p>
          </div>
          <input type="text" class="input" id="users-search" placeholder="Cari nama / email…" style="max-width:250px">
        </div>
        <div id="tbl-users"></div>
      </div>
    </main>
    <footer class="adm-footer" id="adm-footer"></footer>
  </div>
</div>
<script src="../config/runtime-config.js"></script>
<script src="../config/supabase.js"></script>
<script src="../js/data-fallback.js"></script>
<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script src="../js/admin/admin.js"></script>
<script src="../js/admin/users.js"></script>
</body>
</html>
